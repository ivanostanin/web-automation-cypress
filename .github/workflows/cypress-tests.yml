# Ways to improve: use strategy.matrix to cover multiple browsers and node.js versions

name: Cypress UI Tests

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Start application
        run: |
          npm run app:run &
          npx wait-on http://localhost:3000 

      - name: Run Cypress tests
        run: npm run cypress:run

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: ./allure-report

      - name: Get sanitized branch name
        id: branch
        if: always()
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's#/#-#g')
          echo "branch_path=$SANITIZED_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          destination_dir: "${{ steps.branch.outputs.branch_path }}/allure/"

      - name: Print Report URL
        if: always()
        run: |
          echo "Allure report available at:"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ steps.branch.outputs.branch_path }}/allure/index.html"
